# Public catalog of MCP tools currently competing in the CompaRAG arena.
# Built into frontend/src/lib/generated/tools.json by utils/news/build_tools.py
# and rendered as cards on /news under the "Outils MCP" category.
#
# Schema:
#   id           lowercase identifier — used as logo filename and card key
#   name         human-readable display name
#   sub_kind     framework | engine | hosted
#   desc         1–2 sentence FR blurb shown on the card
#   homepage_url URL the card's "Visiter le site" button opens
#   logo_url     where build_tools.py fetches the logo on first build
#                (skipped if frontend/static/tools/{id}.svg or .png already exists)
#   logo_local   optional — copy from this repo path instead of fetching from web

- id: langchain
  name: LangChain
  sub_kind: framework
  desc: |
    Framework Python pour orchestrer des chaînes RAG, des agents et des appels
    LLM. Dans l'arène, LangChain est associé à FAISS comme magasin vectoriel.
  homepage_url: https://www.langchain.com
  logo_local: frontend/node_modules/@lobehub/icons-static-svg/icons/langchain-color.svg

- id: llamaindex
  name: LlamaIndex
  sub_kind: framework
  desc: |
    Framework de connecteurs et d'index pour applications LLM, centré sur le RAG
    avancé. Évalué dans l'arène avec son `VectorStoreIndex` natif.
  homepage_url: https://www.llamaindex.ai
  logo_local: frontend/node_modules/@lobehub/icons-static-svg/icons/llamaindex-color.svg

- id: haystack
  name: Haystack
  sub_kind: framework
  desc: |
    Framework open-source de deepset pour pipelines NLP de production : recherche
    sémantique, RAG, agents. Configuré ici avec `InMemoryDocumentStore`.
  homepage_url: https://haystack.deepset.ai
  logo_url: https://avatars.githubusercontent.com/u/51827949

- id: txtai
  name: txtai
  sub_kind: engine
  desc: |
    Plateforme tout-en-un de recherche sémantique et d'orchestration de modèles,
    avec base de données d'embeddings intégrée. Branchée à OpenAI pour la
    vectorisation externe.
  homepage_url: https://neuml.github.io/txtai
  logo_url: https://raw.githubusercontent.com/neuml/txtai/master/logo.png

- id: chroma
  name: Chroma
  sub_kind: engine
  desc: |
    Base de données vectorielle open-source pensée pour les applications IA.
    Présente dans l'arène comme baseline interprétable (chunking simple, top-k
    cosinus, sans reranker).
  homepage_url: https://www.trychroma.com
  logo_url: https://avatars.githubusercontent.com/u/110818415

- id: clarifeye
  name: Clarifeye
  sub_kind: hosted
  desc: |
    Plateforme hébergée d'agents IA outillés sur des sources de connaissance
    structurées (playbooks, schémas). Connectée à l'arène via un serveur MCP
    dédié.
  homepage_url: https://clarifeye.io
  logo_url: https://env-3256.gcp.clarifeye.io/favicon.ico
